  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }

  .where { color: #555; white-space: nowrap; }

  .chips button {

  }
  .chips button.active { background: #3f3d9e; color: #fff; border-color: #3f3d9e; }
  .controls { display: flex; gap: 6px; align-items: center; padding-top: 6px; }
  .controls button {
    border: 1px solid #c8c8d0; background: #fff; border-radius: 8px; font: inherit; color: #3f3d9e;

  }

  .chooser { margin-top: 8px; }

  .chooser button { background: #f4f4f6; }

data-group="b19bcd7ecec34f31b95653f3f6da7bf9" cx="24.6" cy="5.8" r="0.22" fill="#86bcb6" stroke="#6b5638" stroke-width="0.03"/><circle class="seat" data-group="b19bcd7ecec34f31b95653f3f6da7bf9" cx="25.2" cy="5.8" r="0.22" fill="#86bcb6" stroke="#6b5638" stroke-width="0.03"/><circle class="seat" data-group="b19bcd7ecec34f31b95653f3f6da7bf9" cx="25.8" cy="5.8" r="0.22" fill="#86bcb6" stroke="#6b5638" stroke-width="0.03"/><circle class="seat" data-group="b19bcd7ecec34f31b95653f3f6da7bf9" cx="26.4" cy="5.8" r="0.22" fill="#86bcb6" stroke="#6b5638" stroke-width="0.03"/><circle class="seat" data-group="b19bcd7ecec34f31b95653f3f6da7bf9" cx="27" cy="5.8" r="0.22" fill="#86bcb6" stroke="#6b5638" stroke-width="0.03"/><circle class="seat" data-group="b19bcd7ecec34f31b95653f3f6da7bf9" cx="27.6" cy="5.8" r="0.22" fill="#86bcb6" stroke="#6b5638" stroke-width="0.03"/><circle class="seat" data-group="b19bcd7ecec34f31b95653f3f6da7bf9" cx="23.4" cy="7.2" r="0.22" fill="#86bcb6" stroke="#6b5638" stroke-width="0.03"/><circle class="seat" data-group="b19bcd7ecec34f31b95653f3f6da7bf9" cx="24" cy="7.2" r="0.22" fill="#86bcb6" stroke="#6b5638" stroke-width="0.03"/><circle class="seat" data-group="b19bcd7ecec34f31b95653f3f6da7bf9" cx="24.6" cy="7.2" r="0.22" fill="#86bcb6" stroke="#6b5638" stroke-width="0.03"/><circle class="seat" data-group="b19bcd7ecec34f31b95653f3f6da7bf9" cx="25.2" cy="7.2" r="0.22" fill="#86bcb6" stroke="#6b5638" stroke-width="0.03"/><circle class="seat" data-group="b19bcd7ecec34f31b95653f3f6da7bf9" cx="25.8" cy="7.2" r="0.22" fill="#86bcb6" stroke="#6b5638" stroke-width="0.03"/><circle class="seat" data-group="b19bcd7ecec34f31b95653f3f6da7bf9" cx="26.4" cy="7.2" r="0.22" fill="#86bcb6" stroke="#6b5638" stroke-width="0.03"/><circle class="seat" data-group="b19bcd7ecec34f31b95653f3f6da7bf9" cx="27" cy="7.2" r="0.22" fill="#86bcb6" stroke="#6b5638" stroke-width="0.03"/><circle class="seat" data-group="b19bcd7ecec34f31b95653f3f6da7bf9" cx="27.6" cy="7.2" r="0.22" fill="#8       <button type="button" data-zoom="1.6" aria-label="Zoom out">−</button>
      <span class="spacer"></span>
      <button type="button" class="whole">Whole floor</button>
    </div>
    <div class="chooser" hidden></div>
  </figure>
  
</section>

<script>
(() => {
  const list = document.getElementById("list");
  const detail = document.getElementById("detail");
  const floors = document.getElementById("floors");
  const hint = document.getElementById("plan-hint");
  const search = document.getElementById("search");
  const nothing = document.getElementById("nothing");
  const tabs = [...document.querySelectorAll(".tabs button")];
  const buttons = [...document.querySelectorAll("#groups button")];
  const groups = new Map(buttons.map(b => [b.dataset.group, b]));
  const figures = [...floors.querySelectorAll("figure")];

  // ---- Search: ignores case and accents, so "rene" finds "René" ----
  const fold = text => text.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
  buttons.forEach(b => b.dataset.search = fold(b.dataset.name));
  search?.addEventListener("input", () => {
    const query = fold(search.value.trim());
    let shown = 0;
    for (const b of buttons) {
      const match = b.dataset.search.includes(query);
      b.parentElement.hidden = !match;
      if (match) shown++;
    }
    nothing.hidden = shown > 0;
  });

  // ---- Zooming and moving a floor plan (its viewBox): pinch, drag, mouse wheel, or the buttons ----
  const ZoomMargin = 2, MinWidth = 3, MaxZoomOut = 1.3, BigGroupWidth = 14;
  const box = svg => svg.getAttribute("viewBox").split(" ").map(Number);
  const wholeBox = svg => svg.dataset.whole.split(" ").map(Number);
  const setBox = (svg, [x, y, w, h]) => svg.setAttribute("viewBox", `${x} ${y} ${w} ${h}`);

  // A point on the screen in plan coordinates (metres), and metres per screen pixel.
  function toPlan(svg, clientX, clientY) {
    const m = svg.getScreenCTM();
    if (!m) return { x: 0, y: 0 };
    const p = new DOMPoint(clientX, clientY).matrixTransform(m.inverse());
    return { x: p.x, y: p.y };
  }
  const perPixel = svg => 1 / (svg.getScreenCTM()?.a || 1);

  // Keeps the zoom within limits and the middle of the view on the floor, so the plan cannot get lost.
  function limit(svg, [x, y, w, h]) {
    const [wx, wy, ww, wh] = wholeBox(svg);
    const f = Math.min(Math.max(w, MinWidth), ww * MaxZoomOut) / w;
    const cx = Math.min(Math.max(x + w / 2, wx), wx + ww);
    const cy = Math.min(Math.max(y + h / 2, wy), wy + wh);
    return [cx - w * f / 2, cy - h * f / 2, w * f, h * f];
  }

  function zoomAt(svg, clientX, clientY, factor) {
    const [x, y, w, h] = box(svg);
    const [, , ww] = wholeBox(svg);
    const f = Math.min(Math.max(factor, MinWidth / w), ww * MaxZoomOut / w);
    const p = toPlan(svg, clientX, clientY);
    setBox(svg, limit(svg, [p.x - (p.x - x) * f, p.y - (p.y - y) * f, w * f, h * f]));
  }

  function panBy(svg, dx, dy) {
    const u = perPixel(svg);
    const [x, y, w, h] = box(svg);
    setBox(svg, limit(svg, [x - dx * u, y - dy * u, w, h]));
  }

  function zoomToCentre(svg, factor) {
    const r = svg.getBoundingClientRect();
    zoomAt(svg, r.left + r.width / 2, r.top + r.height / 2, factor);
  }

  for (const figure of figures) {
    const svg = figure.querySelector("svg");
    if (!svg) continue;
    svg.dataset.whole = svg.getAttribute("viewBox");
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    figure.querySelector(".whole").addEventListener("click", () => setBox(svg, wholeBox(svg)));
    figure.querySelectorAll("[data-zoom]").forEach(b => b.addEventListener("click", () => zoomToCentre(svg, Number(b.dataset.zoom))));
    svg.addEventListener("wheel", e => {
      e.preventDefault();
      zoomAt(svg, e.clientX, e.clientY, Math.exp(e.deltaY * 0.0015));
    }, { passive: false });
    // Safari's own pinch gesture would zoom the whole page.
    svg.addEventListener("gesturestart", e => e.preventDefault());

    // One finger (or the mouse) drags; two fingers pinch. A tap without moving picks what is under it.
    const pointers = new Map();
    let tap = null;
    svg.addEventListener("pointerdown", e => {
      svg.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      tap = pointers.size === 1 ? { x: e.clientX, y: e.clientY, target: e.target } : null;
    });
    svg.addEventListener("pointermove", e => {
      const last = pointers.get(e.pointerId);
      if (!last) return;
      if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 6) return;
      tap = null;
      if (pointers.size === 1) {
        panBy(svg, e.clientX - last.x, e.clientY - last.y);
      } else if (pointers.size === 2) {
        const other = [...pointers].find(([id]) => id !== e.pointerId)[1];
        const before = Math.hypot(last.x - other.x, last.y - other.y);
        const after = Math.hypot(e.clientX - other.x, e.clientY - other.y);
        const mid = { x: (e.clientX + other.x) / 2, y: (e.clientY + other.y) / 2 };
        if (before > 0 && after > 0) zoomAt(svg, mid.x, mid.y, before / after);
        panBy(svg, (e.clientX - last.x) / 2, (e.clientY - last.y) / 2);
      }
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    });
    const release = e => {
      if (e.type === "pointerup" && tap && pointers.size === 1) tapped(figure, tap.target);
      pointers.delete(e.pointerId);
      tap = null;
    };
    svg.addEventListener("pointerup", release);
    svg.addEventListener("pointercancel", release);
  }

  // Zooms to the given tables (all of the group's tables on this floor by default).
  function zoomToTables(figure, tables) {
    const svg = figure.querySelector("svg");
    if (!svg || tables.length === 0) return;
    const boxes = tables.map(t => t.getBBox());
    const left = Math.min(...boxes.map(b => b.x)) - ZoomMargin;
    const top = Math.min(...boxes.map(b => b.y)) - ZoomMargin;
    const right = Math.max(...boxes.map(b => b.x + b.width)) + ZoomMargin;
    const bottom = Math.max(...boxes.map(b => b.y + b.height)) + ZoomMargin;
    setBox(svg, limit(svg, [left, top, right - left, bottom - top]));
  }

  // A big group spread over many tables starts on its first table, with a button per table to look at the others.
  function showGroupTables() {
    const chips = document.getElementById("detail-chips");
    chips.replaceChildren();
    const mine = figures.filter(f => !f.hidden).flatMap(f => [...f.querySelectorAll(".table.mine")].map(t => ({ figure: f, table: t })));
    const boxes = mine.map(m => m.table.getBBox());
    const wide = boxes.length > 0
      && Math.max(...boxes.map(b => b.x + b.width)) - Math.min(...boxes.map(b => b.x)) > BigGroupWidth
      || new Set(mine.map(m => m.figure)).size > 1;
    figures.filter(f => !f.hidden).forEach(f => zoomToTables(f, [...f.querySelectorAll(".table.mine")]));
    chips.hidden = mine.length < 2;
    if (mine.length < 2) return;

    const choose = (button, show) => {
      chips.querySelectorAll("button").forEach(b => b.classList.toggle("active", b === button));
      show();
    };
    const all = document.createElement("button");
    all.type = "button";
    all.textContent = "All";
    all.addEventListener("click", () => choose(all, () =>
      figures.filter(f => !f.hidden).forEach(f => zoomToTables(f, [...f.querySelectorAll(".table.mine")]))));
    chips.append(all);
    for (const { figure, table } of mine) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = table.dataset.table;
      b.addEventListener("click", () => choose(b, () => {
        zoomToTables(figure, [table]);
        figure.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }));
      chips.append(b);
    }
    if (wide) chips.children[1].click(); else all.classList.add("active");
  }

  // A seat or name opens its group; a table with several groups offers them to choose from.
  function tapped(figure, target) {
    const chooser = figure.querySelector(".chooser");
    const key = target.closest("[data-group]")?.dataset.group;
    if (key && groups.has(key)) {
      open(key);
      return;
    }
    const table = target.closest(".table");
    if (!table) {
      chooser.hidden = true;
      return;
    }
    const keys = [...new Set([...table.querySelectorAll("[data-group]")].map(e => e.dataset.group))].filter(k => groups.has(k));
    if (keys.length === 1) {
      open(keys[0]);
      return;
    }
    chooser.replaceChildren();
    const title = document.createElement("p");
    title.textContent = keys.length === 0 ? `Table ${table.dataset.table} has no one seated.` : `Table ${table.dataset.table}`;
    chooser.append(title);
    for (const k of keys) {
      const g = groups.get(k);
      const choice = document.createElement("button");
      choice.type = "button";
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = g.dataset.colour;
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = g.dataset.name;
      choice.append(dot, name);
      choice.addEventListener("click", () => open(k));
      chooser.append(choice);
    }
    chooser.hidden = false;
  }

  // ---- Views: the group list, the floor plan, or one group. The view goes in the address (#plan, #group), so the
  // phone's back button works and links can point at a group. Where that is not allowed (e.g. in a preview), the
  // page works without it. ----
  let view = "list", from = "list", inHistory = false;

  // Where each floor plan was zoomed on the plan tab, so coming back from a group returns to the same spot.
  const planBoxes = new Map();

  function render(next) {
    const group = groups.get(next);
    if (view === "plan" && group)
      figures.forEach(f => f.querySelector("svg") && planBoxes.set(f, f.querySelector("svg").getAttribute("viewBox")));
    view = group ? next : next === "plan" ? "plan" : "list";
    list.hidden = view !== "list";
    detail.hidden = !group;
    floors.hidden = view === "list";
    hint.hidden = !!group;
    document.body.classList.toggle("focus", !!group);
    tabs.forEach(t => t.classList.toggle("active", t.dataset.view === (group ? from : view)));

    for (const figure of figures) {
      figure.querySelector(".chooser").hidden = true;
      figure.querySelectorAll(".mine").forEach(e => e.classList.remove("mine"));
      const svg = figure.querySelector("svg");
      if (!group) {
        figure.hidden = false;
        if (svg) svg.setAttribute("viewBox", view === "plan" && planBoxes.get(figure) || svg.dataset.whole);
        continue;
      }
      const seats = figure.querySelectorAll(`[data-group="${next}"]`);
      seats.forEach(seat => {
        seat.classList.add("mine");
        seat.closest(".table")?.classList.add("mine");
      });
      figure.hidden = seats.length === 0;
    }
    if (group) {
      document.getElementById("detail-name").textContent = group.dataset.name;
      const tables = group.dataset.tables;
      document.getElementById("detail-tables").textContent = (tables.includes(",") ? "Tables " : "Table ") + tables;
      document.getElementById("detail-floor").textContent = group.dataset.floor;
      // Sizes can only be measured once the plans are shown.
      showGroupTables();
    } else {
      document.getElementById("detail-chips").hidden = true;
    }
    if (view === "list") planBoxes.clear();
    window.scrollTo(0, 0);
  }

  function go(next) {
    if (!groups.has(next)) from = next;
    try {
      history.pushState(null, "", "#" + next);
      inHistory = true;
    } catch {
      inHistory = false;
    }
    render(next);
  }

  function open(key) {
    if (!groups.has(view)) from = view;
    go(key);
  }

  buttons.forEach(b => b.addEventListener("click", () => open(b.dataset.group)));
  tabs.forEach(t => t.addEventListener("click", () => go(t.dataset.view)));
  document.getElementById("back").addEventListener("click", () => {
    if (inHistory) history.back(); else render(from);
  });
  window.addEventListener("popstate", () => render(location.hash.slice(1) || "list"));
  render(location.hash.slice(1) || "list");
})();
</script>
</body>
</html>
